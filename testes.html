<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/styles/styles.css">
    <link rel="stylesheet" href="src/styles/header.css">
    <title>Landing Page</title>
</head>
<body>
    <header>
        <nav id="navbar">
            <i class="fa-brands fa-avianex" id="nav_logo">PaperFly</i>
            <div>
                <ul id="nav_list">
                    <li class="nav-item active">
                        <a href="#home">Início</a>
                    </li>
                    <li class="nav-item">
                        <a href="#Avioes">Modelos</a>
                    </li>
                    <li class="nav-item">
                        <a href="#testimonials">Avaliações</a>
                    </li>
                </ul>
            </div>
            <button class="btn-default">Peça aqui</button>
            <button id="mobile_btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
        <div id="mobile_Avioes">
            <ul id="mobile_nav_list">
                <li class="nav-item">
                    <a href="#home">Início</a>
                </li>
                <li class="nav-item">
                    <a href="#Avioes">Modelos</a>
                </li>
                <li class="nav-item">
                    <a href="#testimonials">Avaliações</a>
                </li>
            </ul>
            <button class="btn-default">Peça aqui</button>
        </div>
    </header>

    <main>
        <section id="home">
            <h1>Bem-vindo ao PaperFly</h1>
            <p>Descubra nossos modelos de aviões e avaliações.</p>
        </section>

        <section id="Avioes">
            <h2>Modelos</h2>
            <p>Informações sobre os aviões disponíveis.</p>
        </section>

        <section id="testimonials">
            <h2>Avaliações</h2>
            <p>Avisos e avaliações dos usuários sobre nossos produtos.</p>
        </section>
    </main>
    
</body>
</html>
